[project]
name = "opstriage-triage"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opstriage-contracts",
  "opstriage-shared",
  "opstriage-llm",
  "opstriage-dynatrace",
  "uvicorn==0.54.0",
  "langgraph==1.2.14",
  "langgraph-checkpoint-postgres==3.1.2",
  "mcp==2.3.0",
  "httpx2==2.13.1",
  "tenacity==9.2.1",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
# PLATFORM=azure images only (docker build --build-arg PLATFORM=azure): managed identity for PostgreSQL and Foundry.
azure = ["opstriage-shared[entra]", "opstriage-llm[entra]"]

[project.scripts]
opstriage-triage = "opstriage_triage.entrypoints.main:main"
opstriage-evals = "opstriage_triage.entrypoints.evals:main"

[tool.uv.sources]
opstriage-contracts = { workspace = true }
opstriage-shared = { workspace = true }
opstriage-llm = { workspace = true }
opstriage-dynatrace = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opstriage_triage"]
