{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Sign in</h1>
  <p class="muted">Enter an access token for health review. In shared environments, sign-in goes through your organisation's identity provider instead.</p>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/login" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="token">Access token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
