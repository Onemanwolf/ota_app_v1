[project]
name = "opstriage-health-review"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "opstriage-contracts",
  "opstriage-shared",
  "opstriage-dynatrace",
  "opstriage-llm",
  "mcp==2.3.0",
  "uvicorn==0.54.0",
  "pyyaml==6.0.3",
  "httpx2==2.13.1",
]

[project.scripts]
opstriage-health-review = "opstriage_insights.entrypoints.main:main"

[tool.uv.sources]
opstriage-contracts = { workspace = true }
opstriage-shared = { workspace = true }
opstriage-dynatrace = { workspace = true }
opstriage-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opstriage_insights"]
