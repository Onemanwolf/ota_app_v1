[project]
name = "opstriage-webhook-sink"
version = "0.1.0"
description = "Local only: captures Teams Workflows webhook posts so tests and humans can see them"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "pydantic-settings==2.15.0",
]

[project.scripts]
opstriage-webhook-sink = "opstriage_webhook_sink.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opstriage_webhook_sink"]
