# Local restart target registry (spec 12.5.2). The registry is the ONLY source of restartable targets.
# Local stacks reference only local_docker targets, so they never need Azure or SSH credentials.
# Azure and SSH examples live in targets.dev.yaml.
version: 1
targets:
  - id: demo-orders-api                 # must match ^[a-z0-9][a-z0-9_.-]{0,62}$
    description: Local demo container
    match:                              # deterministic matching against ProblemEvent entities
      entity_ids: ["CONTAINER-8A1F00C2D3E4B5A6"]
      host_entity_ids: ["HOST-017198AD253CBD63"]
      container_names: ["demo-orders-api"]
    executor:
      kind: local_docker
      container: demo-orders-api
    policy:
      autonomy: approval_required
      cooldown_minutes: 15
      max_restarts_per_day: 5
      restart_timeout_seconds: 20

  # Second local target so the ambiguous-target scenario has two matches. No such container runs.
  - id: demo-orders-worker
    description: Local demo worker (exists only to exercise ambiguity)
    match:
      entity_ids: ["CONTAINER-9B2E11D3E4F5A6B7"]
      host_entity_ids: ["HOST-017198AD253CBD63"]
      container_names: ["demo-orders-worker"]
    executor:
      kind: local_docker
      container: demo-orders-worker
    policy:
      autonomy: notify_only
      cooldown_minutes: 15
      max_restarts_per_day: 5
      restart_timeout_seconds: 20

  # Kafka targets for the fixtures in fixtures/kafka (matched by Dynatrace PROCESS_GROUP_INSTANCE id). Locally the
  # executor restarts small stand-in containers (demo-kafka-N, demo-orders-consumer in compose.yaml).
  # A problem touching several brokers matches several targets -> ambiguous -> escalate, never restart.
  - id: kafka-broker-0
    description: Kafka broker kafka-0 (StatefulSet streaming/kafka)
    match:
      entity_ids: ["PROCESS_GROUP_INSTANCE-6A1E3F9C2B7D4E10"]
    executor:
      kind: local_docker
      container: demo-kafka-0
    policy: &broker-policy
      autonomy: approval_required
      cooldown_minutes: 30           # let ISR catch up (URP back to 0) before another broker restart
      max_restarts_per_day: 3
      restart_timeout_seconds: 60    # controlled shutdown, never kill -9

  - id: kafka-broker-1
    description: Kafka broker kafka-1 (StatefulSet streaming/kafka)
    match:
      entity_ids: ["PROCESS_GROUP_INSTANCE-6A1E3F9C2B7D4E11"]
    executor:
      kind: local_docker
      container: demo-kafka-1
    policy: *broker-policy

  - id: kafka-broker-2
    description: Kafka broker kafka-2 (StatefulSet streaming/kafka)
    match:
      entity_ids: ["PROCESS_GROUP_INSTANCE-6A1E3F9C2B7D4E12"]
    executor:
      kind: local_docker
      container: demo-kafka-2
    policy: *broker-policy

  - id: orders-consumer
    description: orders consumer group member (Deployment streaming/orders-consumer)
    match:
      entity_ids: ["PROCESS_GROUP_INSTANCE-C0A1B2C3D4E5F601"]
    executor:
      kind: local_docker
      container: demo-orders-consumer
    policy:
      autonomy: approval_required
      cooldown_minutes: 15
      max_restarts_per_day: 5
      restart_timeout_seconds: 30
