# Production restart targets (spec 12.5.2; OTA-AZ-001 sections 7.9 and 9). Baked into the image as
# /app/config/targets.yaml. PLACEHOLDERS ONLY: replace every <sub>, <rg> and <vm> before deploying.
# Until replaced, the azure_run_command executor refuses these targets (the resource ID does not validate).
#
# Rules for this file:
# - azure_run_command only. PLATFORM=azure refuses local_docker targets at startup.
# - Every resource_id needs the "OpsTriage VM Run Command" role assignment for id-mcp-remediation
#   (var.restart_target_vm_ids in Terraform must list exactly these VMs; CI checks both directions).
# - Every container must also be in the ALLOWED list of /usr/local/sbin/restart-allowed.sh on that VM.
# - Policy stays conservative: approval_required (REMEDIATION__MAX_AUTONOMY caps it anyway).
version: 1
targets:
  - id: orders-api-vm01                 # PLACEHOLDER target; must match ^[a-z0-9][a-z0-9_.-]{0,62}$
    description: "PLACEHOLDER: Orders API on <vm> (Azure VM)"
    match:
      host_entity_ids: ["HOST-0000000000000000"]   # PLACEHOLDER: Dynatrace host entity ID of the VM
      container_names: ["orders-api"]
    executor:
      kind: azure_run_command
      resource_id: /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Compute/virtualMachines/<vm>
      container: orders-api
    policy:
      autonomy: approval_required
      cooldown_minutes: 30
      max_restarts_per_day: 3
      restart_timeout_seconds: 30

  - id: orders-worker-vm01              # PLACEHOLDER target
    description: "PLACEHOLDER: Orders worker on <vm> (Azure VM)"
    match:
      host_entity_ids: ["HOST-0000000000000000"]   # PLACEHOLDER
      container_names: ["orders-worker"]
    executor:
      kind: azure_run_command
      resource_id: /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Compute/virtualMachines/<vm>
      container: orders-worker
    policy:
      autonomy: approval_required
      cooldown_minutes: 30
      max_restarts_per_day: 3
      restart_timeout_seconds: 30
