[project]
name = "ops-triage-agents"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "testcontainers[postgres]==4.15.0",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "import-linter==2.15",
  "types-pyyaml",
  "httpx2==2.13.1",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["opstriage_contracts", "opstriage_shared", "opstriage_*"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "packages/contracts/src:packages/shared/src:services/dev-webhook-sink/src"

[[tool.mypy.overrides]]
module = ["azure_postgresql_auth.*", "azure.*", "testcontainers.*", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "integration: needs Docker (testcontainers)",
  "compose: needs the full docker compose stack running",
]
addopts = "--import-mode=importlib"

[tool.importlinter]
root_packages = ["opstriage_contracts", "opstriage_shared"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Published language depends on pydantic only"
type = "forbidden"
source_modules = ["opstriage_contracts"]
forbidden_modules = [
  "opstriage_shared", "fastapi", "starlette", "langgraph", "mcp", "psycopg", "docker", "azure", "httpx2", "openai",
]
