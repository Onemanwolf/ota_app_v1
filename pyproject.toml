[project]
name = "ops-triage-agents"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "testcontainers[postgres]==4.15.0",
  "ruff==0.17.0",
  "mypy==2.4.0",
  "import-linter==2.15",
  "types-pyyaml",
  "httpx2==2.13.1",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["opstriage_contracts", "opstriage_shared", "opstriage_*"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "E501"]   # test names and fixtures read better unwrapped
"postman/build_collection.py" = ["E501"]   # embedded Postman JavaScript test scripts
"evals/generate_dataset.py" = ["E501"]     # scenario text
"evals/generate_kafka_dataset.py" = ["E501"]
"fixtures/kafka/generate.py" = ["E501"]   # verbatim Kafka log lines and Dynatrace titles
"evals/compare_strategies.py" = ["E501"]  # prompts and runbook text
"evals/kev_finetune/stress.py" = ["E501"]  # verbatim Kafka log lines
"**/domain/questions.py" = ["E501"]         # decision-model prompts, verbatim from spec 12.4.2
"**/entrypoints/evals.py" = ["E501"]        # Markdown report rows

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
exclude = ["/tests/"]   # test modules share names across services; pytest still runs them
mypy_path = "packages/contracts/src:packages/shared/src:services/dev-webhook-sink/src:services/intake-api/src:services/agent-runtime/src:services/mcp-notification/src:services/mcp-ticketing/src:services/mcp-remediation/src:services/poller/src"

[[tool.mypy.overrides]]
module = ["azure_postgresql_auth.*", "azure.*", "testcontainers.*", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "integration: needs Docker (testcontainers)",
  "compose: needs the full docker compose stack running",
]
addopts = "--import-mode=importlib -m 'not compose'"   # -m compose on the CLI overrides this

[tool.importlinter]
root_packages = [
  "opstriage_contracts", "opstriage_shared", "opstriage_intake", "opstriage_triage", "opstriage_notification",
  "opstriage_ticketing", "opstriage_remediation", "opstriage_poller",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Published language depends on pydantic only"
type = "forbidden"
source_modules = ["opstriage_contracts"]
forbidden_modules = [
  "opstriage_shared", "fastapi", "starlette", "langgraph", "mcp", "psycopg", "docker", "azure", "httpx2", "openai",
]

[[tool.importlinter.contracts]]
name = "Domain and application layers import no frameworks or SDKs"
type = "forbidden"
source_modules = [
  "opstriage_intake.domain", "opstriage_intake.application",
  "opstriage_triage.domain", "opstriage_triage.application",
  "opstriage_notification.domain", "opstriage_notification.application",
  "opstriage_ticketing.domain", "opstriage_ticketing.application",
  "opstriage_remediation.domain", "opstriage_remediation.application",
  "opstriage_poller.domain", "opstriage_poller.application",
]
forbidden_modules = [
  "fastapi", "starlette", "langgraph", "mcp", "psycopg", "psycopg_pool", "docker", "azure", "httpx2", "openai",
  "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Bounded contexts do not import each other"
type = "independence"
modules = [
  "opstriage_intake", "opstriage_triage", "opstriage_notification", "opstriage_ticketing", "opstriage_remediation",
  "opstriage_poller",
]

[[tool.importlinter.contracts]]
name = "Domain does not depend on adapters, entrypoints or the graph"
type = "forbidden"
source_modules = [
  "opstriage_intake.domain", "opstriage_triage.domain", "opstriage_notification.domain",
  "opstriage_ticketing.domain", "opstriage_remediation.domain", "opstriage_poller.domain",
]
forbidden_modules = [
  "opstriage_intake.adapters", "opstriage_intake.entrypoints",
  "opstriage_triage.adapters", "opstriage_triage.entrypoints", "opstriage_triage.graph",
  "opstriage_notification.adapters", "opstriage_notification.entrypoints",
  "opstriage_ticketing.adapters", "opstriage_ticketing.entrypoints",
  "opstriage_remediation.adapters", "opstriage_remediation.entrypoints",
  "opstriage_poller.adapters", "opstriage_poller.entrypoints",
]
