[project]
name = "opstriage-dynatrace"
version = "0.1.0"
description = "Dynatrace platform clients shared by services: OAuth client credentials and the Grail Query API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.12,<3",
  "httpx2==2.13.1",
  "tenacity==9.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opstriage_dynatrace"]
