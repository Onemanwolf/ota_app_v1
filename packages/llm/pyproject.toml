[project]
name = "opstriage-llm"
version = "0.1.0"
description = "Model-agnostic chat client: any OpenAI-compatible endpoint (vLLM, Ollama, OpenAI, Azure OpenAI, gateways)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.12,<3",
  "httpx2==2.13.1",
  "tenacity==9.2.1",
]

[project.optional-dependencies]
# Azure only: Entra ID tokens for Azure OpenAI / Foundry. Local stacks never install it.
entra = ["azure-identity==1.26.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opstriage_llm"]
