[project]
name = "opstriage-contracts"
version = "0.1.0"
description = "Published language: canonical problem event, triage decision and MCP tool contracts"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
opstriage-contracts = "opstriage_contracts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opstriage_contracts"]
