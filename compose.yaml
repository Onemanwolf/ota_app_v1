name: opstriage

# Local stack (spec 12.2.7).
x-python-service: &python-service
  env_file: [.env]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
  volumes:
    - ./config:/app/config:ro
    - ./fixtures:/app/fixtures:ro

x-http-health: &http-health
  test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('SERVER__PORT','8000') + '/healthz')"]
  interval: 10s
  retries: 10
  start_period: 10s

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: opstriage
      POSTGRES_PASSWORD: opstriage
      POSTGRES_DB: opstriage
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opstriage"]
      interval: 5s
      retries: 20

  intake-api:
    <<: *python-service
    build: { context: ., dockerfile: services/intake-api/Dockerfile }
    ports: ["8000:8000"]
    healthcheck: *http-health

  agent-runtime:
    <<: *python-service
    build: { context: ., dockerfile: services/agent-runtime/Dockerfile }
    ports: ["8010:8010"]
    environment:
      SERVER__PORT: "8010"
      TRIAGE__INSIGHTS_BASE_URL: http://localhost:8120   # "Analyse root cause" link on Teams cards
    healthcheck: *http-health
    depends_on:
      postgres: { condition: service_healthy }
      intake-api: { condition: service_healthy }      # owns the inbox table the worker consumes
      mcp-notification: { condition: service_healthy }
      mcp-ticketing: { condition: service_healthy }
      mcp-remediation: { condition: service_healthy }

  poller:                                 # POLLER__SOURCE=fake replays fixtures/dynatrace/grail locally
    <<: *python-service
    build: { context: ., dockerfile: services/poller/Dockerfile }
    depends_on:                           # replaces the anchor's depends_on, so repeat postgres
      postgres: { condition: service_healthy }
      intake-api: { condition: service_healthy }

  health-review:                          # OTA-APP-002; INSIGHTS__SOURCE=fake serves fixtures/insights
    <<: *python-service
    build: { context: ., dockerfile: services/health-review/Dockerfile }
    environment:
      SERVER__PORT: "8120"
      INSIGHTS__SERVICE_TOKENS: '["dev-insights-token"]'
      INSIGHTS__GUARD__BASE_URL: http://host.docker.internal:18004   # Spark guard via scripts/kev-tunnel.sh
      INSIGHTS__ANALYST__BASE_URL: http://host.docker.internal:18001  # any OpenAI-compatible model; docs/model-providers.md
      INSIGHTS__ANALYST__MODEL: qwen3.8-flash-next
      INSIGHTS__ANALYST__EXTRA_BODY: '{"chat_template_kwargs": {"enable_thinking": false}}'   # Qwen-specific
      INSIGHTS__NOTIFY__MCP_TOKEN: dev-mcp-notification
    ports: ["8120:8120"]
    healthcheck: *http-health
    depends_on:
      postgres: { condition: service_healthy }
      mcp-notification: { condition: service_healthy }

  mcp-notification:
    <<: *python-service
    build: { context: ., dockerfile: services/mcp-notification/Dockerfile }
    environment:
      AUTH__INBOUND_TOKENS: '["dev-mcp-notification"]'
      SERVER__PORT: "8101"
      SERVER__ALLOWED_HOSTS: '["localhost:*","mcp-notification:*"]'
    ports: ["8101:8101"]
    healthcheck: *http-health

  mcp-ticketing:
    <<: *python-service
    build: { context: ., dockerfile: services/mcp-ticketing/Dockerfile }
    environment:
      AUTH__INBOUND_TOKENS: '["dev-mcp-ticketing"]'
      SERVER__PORT: "8102"
      SERVER__ALLOWED_HOSTS: '["localhost:*","mcp-ticketing:*"]'
    ports: ["8102:8102"]
    healthcheck: *http-health

  mcp-remediation:
    <<: *python-service
    build: { context: ., dockerfile: services/mcp-remediation/Dockerfile }
    environment:
      AUTH__INBOUND_TOKENS: '["dev-mcp-remediation"]'
      SERVER__PORT: "8103"
      SERVER__ALLOWED_HOSTS: '["localhost:*","mcp-remediation:*"]'
    ports: ["8103:8103"]
    healthcheck: *http-health
    user: "0:0"                           # local only: needed to use the mounted Docker socket
    # Local executor only: mounting the Docker socket is root-equivalent on the host. The service refuses to
    # build the local_docker executor unless APP_ENV=local and REMEDIATION__ALLOW_LOCAL_DOCKER=true.
    volumes:
      - ./config:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock

  mailpit:                                # mock email (SMTP 1025, UI and API 8025)
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]

  webhook-sink:                           # mock Microsoft Teams Workflows webhook
    build: { context: ., dockerfile: services/dev-webhook-sink/Dockerfile }
    ports: ["${SINK_HOST_PORT:-8090}:8090"]   # host port is configurable (8090 may be taken)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz')"]
      interval: 10s
      retries: 10

  demo-target:                            # restart targets for the local executor (stand-ins, see targets.example.yaml)
    image: nginx:alpine
    container_name: demo-orders-api

  demo-kafka-0: &kafka-stand-in           # stand-ins for Kafka brokers/consumer in fixtures/kafka scenarios
    image: nginx:alpine
    container_name: demo-kafka-0

  demo-kafka-1:
    <<: *kafka-stand-in
    container_name: demo-kafka-1

  demo-kafka-2:
    <<: *kafka-stand-in
    container_name: demo-kafka-2

  demo-orders-consumer:
    <<: *kafka-stand-in
    container_name: demo-orders-consumer

volumes:
  pgdata: {}
